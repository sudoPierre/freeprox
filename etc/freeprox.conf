# freeprox configuration — /etc/freeprox/freeprox.conf
# Commented values are the defaults.

[freebox]
# Freebox address. Over HTTPS the certificate is signed by the Freebox CA:
# provide it with ca_file, or set verify_tls = false.
#url = http://mafreebox.freebox.fr
#token_file = /etc/freeprox/app_token
#verify_tls = true
#ca_file =
#timeout = 10

[proxmox]
# Local node name (auto-detected through /etc/pve/local).
#node =
# Bridges connected to the Freebox LAN: only NICs attached to them get a
# reservation. Leave empty for all NICs.
#bridges = vmbr0
# Tag added to the VM/LXC once its IP is pinned on the Freebox (visible in the
# Proxmox UI, removed by 'freeprox release'). Leave empty to disable.
#tag = freeprox
# Do not reserve IPs for templates.
#skip_templates = true
# On the very first start, also process guests that already exist.
# (Otherwise: freeprox sync --all on demand.)
#process_existing = false

[dhcp]
# Range in which static IPs are picked (default: the Freebox DHCP range).
#pool_start = 192.168.1.100
#pool_end = 192.168.1.199
# IPs or ranges never to assign, separated by commas or spaces.
#exclude = 192.168.1.1, 192.168.1.240-192.168.1.250
# Keep the IP the DHCP server already gave the guest, if any.
#prefer_current_ip = true
# Reuse the static IP declared inside the guest (LXC ip=…, cloud-init ipconfigN).
#use_guest_static_ip = true
# Skip IPs that answer ping (undeclared statically configured devices).
#ping_check = true

[comment]
# Available variables: {type} {type_label} {vmid} {name} {node} {iface} {mac}
# {bridge} {ip} {cores} {memory} {memory_mib} {disk} {ostype} {os} {tags} {date}
#template = [PVE] {type_label} {vmid} {name} | {node}/{iface} | {cores} vCPU, {memory}, {disk} | {os} | {date}
#max_length = 255
# If a lease already exists for this MAC, update its comment.
#update_existing = true

[daemon]
# Polling interval in seconds.
#interval = 10
# Minimum delay since the guest config was last modified.
#settle_seconds = 5
# Delete the leases created by freeprox when the VM/LXC is destroyed.
#remove_on_destroy = false
#state_file = /var/lib/freeprox/state.json
#dry_run = false
#log_level = INFO
