# Configuration de freeprox — /etc/freeprox/freeprox.conf
# Les valeurs commentées sont les valeurs par défaut.

[freebox]
# Adresse de la Freebox. En HTTPS, le certificat est signé par l'autorité Freebox :
# fournissez-la via ca_file, ou mettez verify_tls = false.
#url = http://mafreebox.freebox.fr
#token_file = /etc/freeprox/app_token
#verify_tls = true
#ca_file =
#timeout = 10

[proxmox]
# Nom du nœud local (détecté automatiquement via /etc/pve/local).
#node =
# Ponts reliés au LAN de la Freebox : seules les cartes réseau branchées dessus
# reçoivent une réservation. Laisser vide pour toutes les cartes.
#bridges = vmbr0
# Ne pas réserver d'IP pour les modèles (templates).
#skip_templates = true
# Au tout premier démarrage, traiter aussi les invités déjà existants.
# (Sinon : freeprox sync --all à la demande.)
#process_existing = false

[dhcp]
# Plage dans laquelle choisir les IP fixes (défaut : plage DHCP de la Freebox).
#pool_start = 192.168.1.100
#pool_end = 192.168.1.199
# IP ou plages à ne jamais attribuer, séparées par des virgules ou espaces.
#exclude = 192.168.1.1, 192.168.1.240-192.168.1.250
# Conserver l'IP que le DHCP a déjà donnée à l'invité, s'il en a une.
#prefer_current_ip = true
# Réutiliser l'IP statique déclarée dans l'invité (LXC ip=…, cloud-init ipconfigN).
#use_guest_static_ip = true
# Ignorer les IP qui répondent au ping (machines en IP fixe non déclarées).
#ping_check = true

[comment]
# Variables disponibles : {type} {type_label} {vmid} {name} {node} {iface} {mac}
# {bridge} {ip} {cores} {memory} {memory_mib} {disk} {ostype} {os} {tags} {date}
#template = [PVE] {type_label} {vmid} {name} | {node}/{iface} | {cores} vCPU, {memory}, {disk} | {os} | {date}
#max_length = 255
# Si un bail existe déjà pour ce MAC, mettre à jour son commentaire.
#update_existing = true

[daemon]
# Intervalle de scrutation en secondes.
#interval = 10
# Délai minimal depuis la dernière modification de la config de l'invité.
#settle_seconds = 5
# Supprimer les baux créés par freeprox quand la VM/le LXC est détruit.
#remove_on_destroy = false
#state_file = /var/lib/freeprox/state.json
#dry_run = false
#log_level = INFO
